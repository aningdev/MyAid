[package]
name = "dsh-bot-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
curve25519-dalek = "5.0.0"
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
fs2 = "0.4"
futures-util = "0.3.34"
getrandom = "0.3"
libc = "0.2"
# tokio-tungstenite builds rustls with default features off, which leaves it with no crypto
# provider. Enabling `ring` here selects one for wss.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
snow = "0.10.0"
subtle = "2"
tokio = { version = "1", features = [
  "rt-multi-thread",
  "net",
  "sync",
  "time",
  "macros",
  "io-util",
] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
