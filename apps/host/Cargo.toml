[package]
name = "myaid-host"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fs2 = "0.4"
getrandom = "0.3"
interprocess = "2.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
myaid-relay = { path = "../relay" }
tempfile = "3"
