[package]
name = "dsh-bot-relay"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# `--frame-tap PATH` records every relayed frame, for the end-to-end proof that
# the relay never sees plaintext. Off by default: release builds cannot do it.
frame-tap = []

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22.1"
data-encoding = "2.11.1"
ed25519-dalek = "3.0.0"
futures-util = "0.3.34"
getrandom = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.29.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
