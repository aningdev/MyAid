[package]
name = "myaid-relay"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
fs2 = "0.4"
getrandom = "0.3"
interprocess = "2.4"
libc = "0.2"
myaid-background-service = { path = "../../crates/myaid-background-service" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
widestring = "1.2"
windows-sys = { version = "0.61", features = [
  "Win32_System_Console",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-service-management = "0.3.2"

[dev-dependencies]
tempfile = "3"
