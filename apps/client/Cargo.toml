[package]
name = "nsh-app-myaid"
version = "0.1.0"
edition = "2024"
publish = false

# Official NSH mixed layout: TSX entry + Rust crate at the app root (`nsh.json` `"rust": "."`).
# Member of the repo Cargo workspace (no nested `[workspace]` table).

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
futures-util = { version = "0.3", features = ["sink"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-tungstenite = "0.28"
url = "2"
