[package]
name = "dsh-bot-service"
version = "0.1.0"
edition = "2024"
publish = false
description = "Background Service registration contract and OS launch plan shared by Host and Relay"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"
